---
- name: Build Projects
  hosts: localhost
  connection: local

  pre_tasks:
    - name: Set facts
      ansible.builtin.set_fact:
        user_dir: "{{ ansible_facts['user_dir'] }}"
        user_config_dir: "{{ ansible_facts['user_dir'] }}/.config"
        user_data_dir: "{{ ansible_facts['user_dir'] }}/.local/share"
        user_project_dir: "{{ ansible_facts['user_dir'] }}/Projects"
        nproc: "{{ ansible_facts['processor_nproc'] }}"
      tags: always

  tasks:
    - name: Include roles
      ansible.builtin.include_role:
        name: "{{ item.name }}"
        apply:
          tags: "{{ item.tag }}"
      loop: "{{ roles_list }}"
      when: item.tag in ansible_run_tags
      tags: always
