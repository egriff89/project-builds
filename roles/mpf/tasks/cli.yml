---
- name: Publish MPF.CLI
  ansible.builtin.command:
    cmd: >-
      dotnet publish MPF.CLI/MPF.CLI.csproj
      -f {{ mpf_framework }}
      -r {{ mpf_runtime }}
      -c Release
      --self-contained true
      -p:PublishSingleFile=true
      -p:DebugType=None
      -p:DebugSymbols=false
    chdir: "{{ mpf_repo }}"
  changed_when: false
